name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest & AI Quality Evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          AI_PROVIDER: mock
          SECRET_KEY: ci-test-secret-key-32-chars-long-abcde
          SUPABASE_URL: ""
          GEMINI_API_KEY: ""
        run: |
          python -m pytest tests/ -v

      - name: Run AI Quality & Prompt Effectiveness Benchmark
        env:
          AI_PROVIDER: mock
        run: |
          python tests/evaluate_ai_quality.py

  frontend-tests:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: |
          npx vitest run --reporter=verbose 2>&1 | tee test.log || {
            echo "### Vitest Failure Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Verify Production Bundle Build
        run: npm run build
